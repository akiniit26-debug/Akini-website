name: Add AKINI product
on:
  workflow_dispatch:
    inputs:
      name:
        description: Product name (English)
        required: true
        type: string
      name_it:
        description: Product name (Italian, optional)
        required: false
        type: string
      category:
        description: Category
        required: true
        type: choice
        options:
          - Pets
          - Home
          - Lifestyle
      image_url:
        description: Public HTTPS image URL
        required: true
        type: string
      retailer_url:
        description: Retailer product page URL (HTTPS)
        required: true
        type: string
      asin:
        description: Amazon ASIN (optional)
        required: false
        type: string
      price:
        description: Verified current price (optional, e.g. €16.14)
        required: false
        type: string
      rating:
        description: Verified rating from 0 to 5 (optional)
        required: false
        type: number
      review_count:
        description: Verified review count (optional)
        required: false
        type: number
      description:
        description: Short description (English)
        required: false
        type: string
      description_it:
        description: Short description (Italian, optional)
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: akini-catalogue-operations
  queue: max
jobs:
  add-product:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v7
      - name: Add or update product
        env:
          PRODUCT_NAME: ${{ inputs.name }}
          PRODUCT_NAME_IT: ${{ inputs.name_it }}
          PRODUCT_CATEGORY: ${{ inputs.category }}
          PRODUCT_IMAGE: ${{ inputs.image_url }}
          PRODUCT_URL: ${{ inputs.retailer_url }}
          PRODUCT_ASIN: ${{ inputs.asin }}
          PRODUCT_PRICE: ${{ inputs.price }}
          PRODUCT_RATING: ${{ inputs.rating }}
          PRODUCT_REVIEW_COUNT: ${{ inputs.review_count }}
          PRODUCT_DESCRIPTION: ${{ inputs.description }}
          PRODUCT_DESCRIPTION_IT: ${{ inputs.description_it }}
        run: python3 .github/scripts/add_product.py
      - name: Translate missing product fields with DeepL
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python3 .github/scripts/translate_products.py
      - name: Localize homepage interface with DeepL
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python3 .github/scripts/localize_homepages.py
      - name: Build all 24 language homepages
        run: python3 .github/scripts/sync_products.py
      - name: Commit product catalogue and homepages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json index*.html ui_translations.json
          git diff --cached --quiet || git commit -m "Add product and translate AKINI catalogue"
          git push
