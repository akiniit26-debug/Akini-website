name: AKINI live visual checks
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '**/*.html'
      - '*.json'
      - '**/*.json'
      - '*.js'
      - '**/*.js'
      - '*.css'
      - '**/*.css'
      - 'tests/**'
      - '.github/scripts/**'
      - '.github/workflows/visual-tests.yml'
      - 'playwright.config.js'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - '**/*.html'
      - '*.json'
      - '**/*.json'
      - '*.js'
      - '**/*.js'
      - '*.css'
      - '**/*.css'
      - 'tests/**'
      - '.github/scripts/**'
      - '.github/workflows/visual-tests.yml'
      - 'playwright.config.js'
      - 'package.json'
  workflow_dispatch:
  schedule:
    - cron: "25 5 * * 1"
permissions:
  contents: read
concurrency:
  group: akini-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out website
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.56.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local preview server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/akini-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/akini-http.log
          exit 1
      - name: Run Playwright tests against this commit
        run: npx playwright test tests/live-pages.spec.js
        env:
          AKINI_BASE_URL: http://127.0.0.1:4173
      - name: Upload failure diagnostics
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: akini-visual-test-failures
          path: |
            test-results/**/*.png
            test-results/**/*.md
            test-results/**/*.zip
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
