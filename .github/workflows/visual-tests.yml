name: AKINI live visual checks
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "25 5 * * 1"
permissions:
  contents: read
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          AKINI_BASE_URL: https://akini.eu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akini-visual-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
